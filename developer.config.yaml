brand: &brand easecloud
codename: magento
github_repo: "your-org/your-magento-repo"

domain: &domain "yourdomain.com"
admin_email: &email "admin@yourdomain.com"

vpc:
  cidr_block: "172.35.0.0/16"
  availability_zones_qty: 2
  enable_dns_support: true
  enable_dns_hostnames: true
  instance_tenancy: default

ec2:
  frontend:
    instance_type: "c7g.xlarge"
    volume_size: "25"
    desired_capacity: 2
    min_size: 2
    max_size: 8
  varnish:
    instance_type: "c7g.large"
    volume_size: "25"
    desired_capacity: 2
    min_size: 2
    max_size: 8

asg:
  health_check_type: "EC2"
  health_check_grace_period: "300"

asp:
  evaluation_periods_in: "2"
  evaluation_periods_out: "1"
  period: "300"
  out_threshold: "80"
  in_threshold: "25"

opensearch:
  engine_version: "OpenSearch_2.17"
  instance_type: "m6g.large.search"
  instance_count: 1
  ebs_enabled: true
  volume_type: "gp3"
  volume_size: "50"
  log_type: "ES_APPLICATION_LOGS"

rds:
  allocated_storage: "50"
  max_allocated_storage: "100"
  storage_type: "gp3"
  storage_encrypted: true
  engine: "mariadb"
  engine_version: "10.11.21"
  family: "mariadb10.11"
  instance_class: "db.m7g.large"
  skip_final_snapshot: true
  multi_az: false
  enabled_cloudwatch_logs_exports: "error"
  performance_insights_enabled: true
  copy_tags_to_snapshot: true
  backup_retention_period: "0"
  delete_automated_backups: true
  deletion_protection: false
  parameters:
    - { name: "max_allowed_packet",             value: "268435456" }
    - { name: "max_connect_errors",             value: "500" }
    - { name: "interactive_timeout",            value: "7200" }
    - { name: "wait_timeout",                   value: "7200" }
    - { name: "innodb_lock_wait_timeout",       value: "60" }
    - { name: "innodb_flush_log_at_trx_commit", value: "2" }
    - { name: "tmp_table_size",                 value: "{DBInstanceClassMemory/512}" }
    - { name: "max_heap_table_size",            value: "{DBInstanceClassMemory/512}" }

rabbitmq:
  engine_version: "3.13"
  deployment_mode: "SINGLE_INSTANCE"
  host_instance_type: "mq.m5.large"

redis:
  num_cache_clusters: 1
  node_type: "cache.m7g.large"
  name: ["session", "cache"]
  family: "redis7"
  engine_version: "7.1"
  port: "6379"
  at_rest_encryption_enabled: true
  parameters:
    - { name: "cluster-enabled",   value: "no" }
    - { name: "maxmemory-policy",  value: "allkeys-lfu" }

alb:
  rps_threshold: "5000"
  error_threshold: "25"
  enable_deletion_protection: false

s3:
  - "media"
  - "media-optimized"
  - "system"
  - "backup"

efs:
  var:
    uid: 1001
    gid: 1002
    permissions: "2770"
  media:
    uid: 1001
    gid: 1002
    permissions: "2770"

waf:
  restricted_countries: ["CN", "RU", "IR", "KP", "SD", "SY", "CU"]

password:
  - "database"
  - "rabbitmq"
  - "redis"
  - "opensearch"

string:
  - "admin_path"
  - "health_check"
  - "opensearch"
